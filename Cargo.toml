[workspace]
members = ["xtask"]

[package]
name = "phantom_voicer"
version = "0.3.5"
edition = "2021"
authors = ["Endio"]
license = "ISC"
description = "Persona 5 inspired acid-jazz chord & stab voicer VST3 with built-in Rhodes preview"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "phantom_voicer"
path = "src/main.rs"

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["standalone"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
