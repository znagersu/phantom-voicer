name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.3)"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu

      - name: Run tests
        run: cargo test --lib

      - name: Bundle VST3, CLAP, and Standalone EXE
        run: cargo xtask bundle phantom_voicer --release

      - name: Package release assets
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          $ver = $tag.TrimStart('v', 'V')
          New-Item -ItemType Directory -Force -Path release-staging | Out-Null
          Compress-Archive -Path "target/bundled/phantom_voicer.vst3", "target/bundled/phantom_voicer.clap", "target/bundled/phantom_voicer.exe" -DestinationPath "release-staging/PhantomVoicer-win64.zip" -Force
          $json = @{
            version = $ver
            zip_url = "https://github.com/znagersu/phantom-voicer/releases/download/$tag/PhantomVoicer-win64.zip"
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText("release-staging/latest.json", $json, [System.Text.UTF8Encoding]::new($false))

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            release-staging/PhantomVoicer-win64.zip
            release-staging/latest.json
